name: Photoroom
kind: company
description: >-
  Photoroom is an AI image editing platform with strong background removal and e-commerce-style product photo
  generation. Public APIs include the Remove Background API and the Image Editing API (Plus plan), with specialized
  endpoints for PhotoFix, Reposition, Product Beautifier, Analyze QA, Image to Video, Photo Composition, Virtual Model,
  Flat Lay, and Ghost Mannequin. OpenAPI spec is published.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
