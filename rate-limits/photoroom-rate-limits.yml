description: >-
  Photoroom rate-limits primarily through plan-based image quotas (paid plans are usage-billed
  per image; free tier gives 10 basic + 1,000 sandbox calls/month). Specific HTTP RPS caps
  are not publicly documented. Sandbox mode supports unlimited testing.
notes: Plan-based image budget is the primary control mechanism; HTTP RPS caps not public.
sources:
- https://www.photoroom.com/api/pricing
- https://docs.photoroom.com/
responseCodes:
  throttled: 429
limits:
- name: Free Basic Images / Month
  scope: account
  metric: images
  limit: 10
- name: Free Sandbox Image Editing Calls / Month
  scope: account
  metric: calls
  limit: 1000
- name: HTTP Requests
  scope: account
  metric: requests
  limit: not publicly documented
policies:
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor any Retry-After header.
- name: Sandbox Testing
  description: Use sandbox mode to validate integrations without consuming production credits.
