description: >-
  FOCUS-aligned FinOps view of Photoroom. Photoroom uses per-image usage billing across
  Basic ($0.02) and Plus ($0.10) plans, with Plus calls counted as 5x Basic calls. API
  Partner programs reduce per-image cost to $0.01 for high-volume consumer apps. Enterprise
  contracts require 200K image annual minimum.
notes: Volume threshold to qualify for API Partner ($0.01) is the largest unit-cost lever.
