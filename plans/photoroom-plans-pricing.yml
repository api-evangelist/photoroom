description: >-
  Photoroom API has two main paid plans plus enterprise. Basic ($0.02/image) covers Remove
  Background plus crop/resize. Plus ($0.10/image) adds AI Backgrounds, AI Shadows, image
  editing, and other GenAI capabilities. One Image Editing call equals five Remove
  Background calls in billing. Free tier offers 10 Basic images/month plus 1,000 sandbox
  Image Editing calls/month.
notes: Reconciled from the public API pricing page (May 2026); enterprise minimum 200K images annual commit.
sources:
- https://www.photoroom.com/api/pricing
plans:
- id: photoroom-basic
  name: Basic Plan
  type: usage
  description: Remove Background API access at $0.02 per image plus crop/resize.
  entries:
  - label: Remove Background
    name: bg_remove
    type: per_unit
    metric: image
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0.02 USD/image
    userMultiplied: false
  elements:
  - name: Crop and resize
  - name: API dashboard
- id: photoroom-plus
  name: Plus Plan
  type: usage
  description: Image Editing API at $0.10 per image (1 Plus call = 5 Basic calls in billing).
  entries:
  - label: Image Editing
    name: image_edit
    type: per_unit
    metric: image
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0.10 USD/image
    userMultiplied: false
  elements:
  - name: AI Backgrounds
  - name: AI Shadows
  - name: GenAI editing capabilities
- id: photoroom-enterprise
  name: Enterprise
  type: enterprise
  description: Volume discounts with 200K image annual minimum, dedicated CSM, beta access.
  entries:
  - label: Enterprise Contract
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: annual
    geo: global
    unit: 1
    price: contact sales (200K images/year minimum)
    userMultiplied: false
- id: photoroom-api-partner
  name: API Partner
  type: subscription
  description: $0.01/image for consumer-facing apps processing 100K+ images/month (logo display required).
  entries:
  - label: Per Image
    name: partner
    type: per_unit
    metric: image
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0.01 USD/image
    userMultiplied: false
- id: photoroom-free
  name: Free Tier / Sandbox
  type: free
  description: 10 Basic images/month plus 1,000 sandbox Image Editing calls/month.
  entries:
