        readOnly: false
        destructive: false
        idempotent: false
      call: photoroom.removebackground
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: account-details-v2
      description: Account Details v2
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: photoroom.accountdetailsv2
      outputParameters:
      - type: object
        mapping: $.
    - name: image-editing-v2-plus-plan
      description: Image Editing v2 (Plus plan)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: photoroom.editimageget
      with:
        background.blur.mode: tools.background.blur.mode
        background.blur.radius: tools.background.blur.radius
        background.color: tools.background.color
        background.expandPrompt: tools.background.expandPrompt
        background.guidance.imageFile: tools.background.guidance.imageFile
        background.guidance.imageUrl: tools.background.guidance.imageUrl
        background.guidance.scale: tools.background.guidance.scale
        background.imageUrl: tools.background.imageUrl
        background.negativePrompt: tools.background.negativePrompt
        background.prompt: tools.background.prompt
        background.scaling: tools.background.scaling
        background.seed: tools.background.seed
        beautify.mode: tools.beautify.mode
        beautify.seed: tools.beautify.seed
        describeAnyChange.mode: tools.describeAnyChange.mode
        describeAnyChange.prompt: tools.describeAnyChange.prompt
        describeAnyChange.seed: tools.describeAnyChange.seed
        editWithAI.additionalImages.{key}.imageUrl: tools.editWithAI.additionalImages.{key}.imageUrl
        editWithAI.mode: tools.editWithAI.mode
        editWithAI.prompt: tools.editWithAI.prompt
        editWithAI.seed: tools.editWithAI.seed
        expand.mode: tools.expand.mode
        expand.seed: tools.expand.seed
        export.dpi: tools.export.dpi
        export.format: tools.export.format
        flatLay.mode: tools.flatLay.mode
        flatLay.prompt: tools.flatLay.prompt
