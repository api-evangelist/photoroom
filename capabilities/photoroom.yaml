naftiko: 1.0.0-alpha2
info:
  label: Photoroom API
  description: 'Photoroom API. 7 operations. Lead operation: Account Details v1. Self-contained Naftiko capability covering
    one Photoroom business surface.'
  tags:
  - Photoroom
  - Photoroom API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PHOTOROOM_API_KEY: PHOTOROOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: photoroom
    baseUri: ''
    description: Photoroom API business capability. Self-contained, no shared references.
    resources:
    - name: v1-account
      path: /v1/account
      operations:
      - name: accountdetailsv1
        method: GET
        description: Account Details v1
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-render
      path: /v1/render
      operations:
      - name: editimageget
        method: GET
        description: '[LEGACY] Image Editing v1 (Plus plan)'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: apiKey
          in: query
          type: string
          description: The API key to authenticate the request
        - name: templateId
          in: query
          type: string
          description: The ID of the template to render
          required: true
        - name: imageUrl
          in: query
          type: string
          description: The image URL to render
        - name: conceptUrl
          in: query
          type: string
          description: Deprecated, use `imageUrl` instead.
      - name: editimagepost
        method: POST
        description: '[LEGACY] Image Editing v1 (Plus plan)'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v1-segment
      path: /v1/segment
      operations:
      - name: removebackground
        method: POST
        description: Remove Background (Basic plan)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v2-account
      path: /v2/account
      operations:
      - name: accountdetailsv2
        method: GET
        description: Account Details v2
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-edit
      path: /v2/edit
      operations:
      - name: editimageget
        method: GET
        description: Image Editing v2 (Plus plan)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: background.blur.mode
          in: query
          type: string
          description: Type of blur to apply to the background.
        - name: background.blur.radius
          in: query
          type: number
          description: Radius of the blur effect. Higher values mean the result will be blurrier.
        - name: background.color
          in: query
          type: string
          description: Color of the background. If omitted, background will be transparent unless `background.imageUrl` or
            `background.imageFile` is provided. Can be a hex color witho
        - name: background.expandPrompt
          in: query
          type: string
          description: If `ai.auto`, a pre-processing step is applied to expand the prompt into a longer form.
        - name: background.guidance.imageFile
          in: query
          type: string
          description: Bytes of the image to use as a background image guidance. Only available in the POST request
        - name: background.guidance.imageUrl
          in: query
          type: string
          description: URL of the image to use as a background image guidance.
        - name: background.guidance.scale
          in: query
          type: number
          description: How closely the generated background will be matching the guiding image, between 0 and 1.
        - name: background.imageUrl
          in: query
          type: string
          description: URL of the image to use as a background.
        - name: background.negativePrompt
          in: query
          type: string
          description: '(LEGACY) This parameter will only have an effect when using the previous AI Backgrounds model, which
            is used when setting the header: `pr-ai-background-model-ve'
        - name: background.prompt
          in: query
          type: string
          description: Prompt to use for guiding the background generation process.
        - name: background.scaling
          in: query
          type: string
          description: Whether the background should fit or fill (default) the output image If set to `fit`, the empty pixels
            will be transparent
        - name: background.seed
          in: query
          type: number
          description: Seed used to generate the background. Can be used to get similar looking results for the same prompt.
        - name: beautify.mode
          in: query
          type: string
          description: If enabled, the input image will be beautified (imageFile or imageUrl).
        - name: beautify.seed
          in: query
          type: number
          description: Seed used to run the subject beautifier. Can be used to get similar looking results for the same subject.
        - name: describeAnyChange.mode
          in: query
          type: string
          description: (DEPRECATED) Use `editWithAI.mode` instead.
        - name: describeAnyChange.prompt
          in: query
          type: string
          description: (DEPRECATED) Use `editWithAI.prompt` instead.
        - name: describeAnyChange.seed
          in: query
          type: number
          description: (DEPRECATED) Use `editWithAI.seed` instead.
        - name: editWithAI.additionalImages.{key}.imageUrl
          in: query
          type: string
          description: URL of an additional reference image.
        - name: editWithAI.mode
          in: query
          type: string
          description: Edit with AI mode to use on the main image used by the API.
        - name: editWithAI.prompt
          in: query
          type: string
          description: The natural language prompt describing the change to apply to the image.
        - name: editWithAI.seed
          in: query
          type: number
          description: Seed used for the generation. Can be used to get similar looking results for the same prompt.
        - name: expand.mode
          in: query
          type: string
          description: Expand mode to use on the main image used by the API.
        - name: expand.seed
          in: query
          type: number
          description: Seed used to generate the background. Can be used to get similar looking results for the same prompt.
        - name: export.dpi
          in: query
          type: number
          description: The pixel density of the result image.
        - name: export.format
          in: query
          type: string
          description: The format of the result image.
        - name: flatLay.mode
          in: query
          type: string
          description: Must be set to `ai.auto` to enable flat lay generation.
        - name: flatLay.prompt
          in: query
          type: string
          description: Optional text prompt to guide the generation style.
        - name: flatLay.size
          in: query
          type: string
          description: The output size of the generated image.
        - name: ghostMannequin.mode
          in: query
          type: string
          description: Must be set to `ai.auto` to enable ghost mannequin generation.
        - name: ghostMannequin.prompt
          in: query
          type: string
          description: Optional text prompt to guide the generation style.
        - name: ghostMannequin.size
          in: query
          type: string
          description: The output size of the generated image.
        - name: horizontalAlignment
          in: query
          type: string
          description: '[Advanced] Defines the horizontal alignment of the cutout subject within its bounding box.'
        - name: ignorePaddingAndSnapOnCroppedSides
          in: query
          type: boolean
          description: If set to `true` (default), cropped sides of the subject will snap to the edges For instance, for a
            portrait image cropped below the elbows, the subject will be
        - name: imageFromPrompt.prompt
          in: query
          type: string
          description: The prompt to use for generating the image.
        - name: imageFromPrompt.seed
          in: query
          type: number
          description: Seed used to run the AI image generator. Can be used to get similar looking results for the same prompt.
        - name: imageFromPrompt.size
          in: query
          type: string
          description: Supported sizes for AI image generation
        - name: imageUrl
          in: query
          type: string
          description: URL of the main image used by the API. The GET endpoint accepts `imageUrl` only.
        - name: keepExistingAlphaChannel
          in: query
          type: string
          description: If set to `auto` and if the image has transparency, the existing transparency will be used to cutout
            the subject.
        - name: layers
          in: query
          type: object
        - name: lighting.mode
          in: query
          type: string
          description: Lighting mode to use on the main image used by the API.
        - name: margin
          in: query
          type:
          - number
          - string
          description: General margin around the subject. Can be expressed as a number between 0 and 0.49, a percentage string
            between 0% and 49% (e.g., "30%"), or a pixel value strin
        - name: marginBottom
          in: query
          type:
          - number
          - string
          description: Bottom Margin, overrides general margin on the bottom side. Accepts the same formats as `margin`.
        - name: marginLeft
          in: query
          type:
          - number
          - string
          description: Left Margin, overrides general margin on the left side. Accepts the same formats as `margin`.
        - name: marginRight
          in: query
          type:
          - number
          - string
          description: Right Margin, overrides general margin on the right side. Accepts the same formats as `margin`.
        - name: marginTop
          in: query
          type:
          - number
          - string
          description: Top Margin, overrides general margin on the top side. Accepts the same formats as `margin`.
        - name: maxHeight
          in: query
          type: number
          description: 'Maximum output height. Can only be provided if `outputSize` is `originalImage` or `croppedSubject`.
            Useful for: redimensioning while keeping the aspect ratio'
        - name: maxWidth
          in: query
          type: number
          description: 'Maximum output width. Can only be provided if `outputSize` is `originalImage` or `croppedSubject`.
            Useful for: resizing an image while keeping the aspect ratio'
        - name: outline.blurRadius
          in: query
          type: number
          description: Blur radius for the outline, creating a glow or soft edge effect. Higher values mean the outline will
            be more blurred, 0 means no blur.
        - name: outline.color
          in: query
          type: string
          description: 'Apply a colored outline around the subject to highlight it. Can be a hex color without the hash sign
            (example: `FF0000`, `FF0000EE`) or color name (examples: `r'
        - name: outline.width
          in: query
          type: number
          description: 'Width of the outline relative to the image size. Suggested values:'
        - name: outputSize
          in: query
          type: string
          description: 'Output size of the image. In the form of either:'
        - name: padding
          in: query
          type:
          - number
          - string
          description: General padding around the subject. Can be expressed as a number between 0 and 0.49, a percentage string
            between 0% and 49% (e.g., "30%"), or a pixel value stri
        - name: paddingBottom
          in: query
          type:
          - number
          - string
          description: Bottom padding, overrides general padding on the bottom side. Accepts the same formats as `padding`.
        - name: paddingLeft
          in: query
          type:
          - number
          - string
          description: Left padding, overrides general padding on the left side. Accepts the same formats as `padding`.
        - name: paddingRight
          in: query
          type:
          - number
          - string
          description: Right padding, overrides general padding on the right side. Accepts the same formats as `padding`.
        - name: paddingTop
          in: query
          type:
          - number
          - string
          description: Top padding, overrides general padding on the top side. Accepts the same formats as `padding`.
        - name: preserveMetadata
          in: query
          type: string
          description: Controls which metadata from the original image will be preserved in the output image.
        - name: referenceBox
          in: query
          type: string
          description: '[Advanced] `subjectBox` by default. When set to `originalImage`, the padding / margin will be around
            the original image and not the cropped subject.'
        - name: removeBackground
          in: query
          type: boolean
          description: If enabled (default), the background of the image will be removed using PhotoRoom's award-winning algorithm
        - name: scaling
          in: query
          type: string
          description: Whether the subject should fit (default) or fill the output image If set to `fit`, the empty pixels
            will be transparent
        - name: segmentation.mode
          in: query
          type: string
          description: Controls whether or not the salient object should be kept or ignored by the segmentation model.
        - name: segmentation.negativePrompt
          in: query
          type: string
          description: A textual description of what the segmentation should remove.
        - name: segmentation.prompt
          in: query
          type: string
          description: 'Warning: Text-Guided Segmentation is available as a preview feature. As such, please be aware that
            there could be breaking changes with a 2-week notice period. '
        - name: shadow.directionOverride
          in: query
          type: string
          description: Override for the direction of the shadow.
        - name: shadow.intensityOverride
          in: query
          type: number
          description: Override for the intensity of the shadow.
        - name: shadow.mode
          in: query
          type: string
          description: Shadow generation mode to use on the main image used by the API. If set to `ai.soft`, a soft shadow
            will be generated. Only compatible with legacy AI Shadows mo
        - name: shadow.softnessOverride
          in: query
          type: number
          description: Override for the softness of the shadow.
        - name: shadow.spreadOverride
          in: query
          type: string
          description: Override for the spread of the shadow.
        - name: shadow.subjectPoseOverride
          in: query
          type: string
          description: Override for the pose of the subject.
        - name: templateId
          in: query
          type: string
          description: The ID of the template to render
        - name: textRemoval.mode
          in: query
          type: string
          description: Text removal mode to use on the main image used by the API.
        - name: uncrop.mode
          in: query
          type: string
          description: Uncrop mode to use on the main image used by the API.
        - name: uncrop.seed
          in: query
          type: number
          description: Seed used to generate the background. Can be used to get similar looking results for the same prompt.
        - name: upscale.downscaleIfNeeded
          in: query
          type: string
          description: Optional input downscaling strategy applied before AI Upscale when the selected model rejects the current
            input size.
        - name: upscale.mode
          in: query
          type: string
          description: 'Warning: AI Upscale is available as a preview feature. As such, please be aware that there could be
            breaking changes with a 2-week notice period.'
        - name: verticalAlignment
          in: query
          type: string
          description: '[Advanced] Defines the vertical alignment of the cutout subject within its bounding box.'
        - name: virtualModel.additionalProductImages
          in: query
          type: array
          description: Additional product images showing different angles or details of the same item. These help the model
            better understand the product and generate more accurate re
        - name: virtualModel.mode
          in: query
          type: string
          description: Must be set to `ai.auto` to enable virtual model generation.
        - name: virtualModel.model
          in: query
          type: string
          description: The model (person) to use for the virtual try-on. Either a preset model name or a custom image.
        - name: virtualModel.pose
          in: query
          type: string
          description: The pose of the model in the generated image.
        - name: virtualModel.prompt
          in: query
          type: string
          description: Optional text prompt to guide the generation style.
        - name: virtualModel.quality
          in: query
          type: string
          description: The output quality of the generated image. Higher quality produces larger images. `standard` outputs
            ~1K, `advanced` ~2K, and `premium` ~4K resolution.
        - name: virtualModel.scene
          in: query
          type: string
          description: The scene (background/environment) to use. Either a preset scene name or a custom image.
        - name: virtualModel.size
          in: query
          type: string
          description: The output size of the generated image.
      - name: editimagepost
        method: POST
        description: Image Editing v2 (Plus plan)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.PHOTOROOM_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: photoroom-rest
    port: 8080
    description: REST adapter for Photoroom API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v1/account
      name: v1-account
      description: REST surface for v1-account.
      operations:
      - method: GET
        name: accountdetailsv1
        description: Account Details v1
        call: photoroom.accountdetailsv1
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/render
      name: v1-render
      description: REST surface for v1-render.
      operations:
      - method: GET
        name: editimageget
        description: '[LEGACY] Image Editing v1 (Plus plan)'
        call: photoroom.editimageget
        with:
          apiKey: rest.apiKey
          templateId: rest.templateId
          imageUrl: rest.imageUrl
          conceptUrl: rest.conceptUrl
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: editimagepost
        description: '[LEGACY] Image Editing v1 (Plus plan)'
        call: photoroom.editimagepost
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/segment
      name: v1-segment
      description: REST surface for v1-segment.
      operations:
      - method: POST
        name: removebackground
        description: Remove Background (Basic plan)
        call: photoroom.removebackground
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/account
      name: v2-account
      description: REST surface for v2-account.
      operations:
      - method: GET
        name: accountdetailsv2
        description: Account Details v2
        call: photoroom.accountdetailsv2
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/edit
      name: v2-edit
      description: REST surface for v2-edit.
      operations:
      - method: GET
        name: editimageget
        description: Image Editing v2 (Plus plan)
        call: photoroom.editimageget
        with:
          background.blur.mode: rest.background.blur.mode
          background.blur.radius: rest.background.blur.radius
          background.color: rest.background.color
          background.expandPrompt: rest.background.expandPrompt
          background.guidance.imageFile: rest.background.guidance.imageFile
          background.guidance.imageUrl: rest.background.guidance.imageUrl
          background.guidance.scale: rest.background.guidance.scale
          background.imageUrl: rest.background.imageUrl
          background.negativePrompt: rest.background.negativePrompt
          background.prompt: rest.background.prompt
          background.scaling: rest.background.scaling
          background.seed: rest.background.seed
          beautify.mode: rest.beautify.mode
          beautify.seed: rest.beautify.seed
          describeAnyChange.mode: rest.describeAnyChange.mode
          describeAnyChange.prompt: rest.describeAnyChange.prompt
          describeAnyChange.seed: rest.describeAnyChange.seed
          editWithAI.additionalImages.{key}.imageUrl: rest.editWithAI.additionalImages.{key}.imageUrl
          editWithAI.mode: rest.editWithAI.mode
          editWithAI.prompt: rest.editWithAI.prompt
          editWithAI.seed: rest.editWithAI.seed
          expand.mode: rest.expand.mode
          expand.seed: rest.expand.seed
          export.dpi: rest.export.dpi
          export.format: rest.export.format
          flatLay.mode: rest.flatLay.mode
          flatLay.prompt: rest.flatLay.prompt
          flatLay.size: rest.flatLay.size
          ghostMannequin.mode: rest.ghostMannequin.mode
          ghostMannequin.prompt: rest.ghostMannequin.prompt
          ghostMannequin.size: rest.ghostMannequin.size
          horizontalAlignment: rest.horizontalAlignment
          ignorePaddingAndSnapOnCroppedSides: rest.ignorePaddingAndSnapOnCroppedSides
          imageFromPrompt.prompt: rest.imageFromPrompt.prompt
          imageFromPrompt.seed: rest.imageFromPrompt.seed
          imageFromPrompt.size: rest.imageFromPrompt.size
          imageUrl: rest.imageUrl
          keepExistingAlphaChannel: rest.keepExistingAlphaChannel
          layers: rest.layers
          lighting.mode: rest.lighting.mode
          margin: rest.margin
          marginBottom: rest.marginBottom
          marginLeft: rest.marginLeft
          marginRight: rest.marginRight
          marginTop: rest.marginTop
          maxHeight: rest.maxHeight
          maxWidth: rest.maxWidth
          outline.blurRadius: rest.outline.blurRadius
          outline.color: rest.outline.color
          outline.width: rest.outline.width
          outputSize: rest.outputSize
          padding: rest.padding
          paddingBottom: rest.paddingBottom
          paddingLeft: rest.paddingLeft
          paddingRight: rest.paddingRight
          paddingTop: rest.paddingTop
          preserveMetadata: rest.preserveMetadata
          referenceBox: rest.referenceBox
          removeBackground: rest.removeBackground
          scaling: rest.scaling
          segmentation.mode: rest.segmentation.mode
          segmentation.negativePrompt: rest.segmentation.negativePrompt
          segmentation.prompt: rest.segmentation.prompt
          shadow.directionOverride: rest.shadow.directionOverride
          shadow.intensityOverride: rest.shadow.intensityOverride
          shadow.mode: rest.shadow.mode
          shadow.softnessOverride: rest.shadow.softnessOverride
          shadow.spreadOverride: rest.shadow.spreadOverride
          shadow.subjectPoseOverride: rest.shadow.subjectPoseOverride
          templateId: rest.templateId
          textRemoval.mode: rest.textRemoval.mode
          uncrop.mode: rest.uncrop.mode
          uncrop.seed: rest.uncrop.seed
          upscale.downscaleIfNeeded: rest.upscale.downscaleIfNeeded
          upscale.mode: rest.upscale.mode
          verticalAlignment: rest.verticalAlignment
          virtualModel.additionalProductImages: rest.virtualModel.additionalProductImages
          virtualModel.mode: rest.virtualModel.mode
          virtualModel.model: rest.virtualModel.model
          virtualModel.pose: rest.virtualModel.pose
          virtualModel.prompt: rest.virtualModel.prompt
          virtualModel.quality: rest.virtualModel.quality
          virtualModel.scene: rest.virtualModel.scene
          virtualModel.size: rest.virtualModel.size
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: editimagepost
        description: Image Editing v2 (Plus plan)
        call: photoroom.editimagepost
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: photoroom-mcp
    port: 9090
    transport: http
    description: MCP adapter for Photoroom API. One tool per consumed operation, routed inline through this capability's consumes
